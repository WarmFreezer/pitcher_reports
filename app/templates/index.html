<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{current_user.school.slug|upper}} Stat_Line - Upload</title>
    <link rel="icon" href="{{ url_for('static', filename='resources/favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/reports.css') }}">

    {% if branding %}
    <style>
        :root {
            --primary: {{branding.colors.primary}};
            --secondary: {{branding.colors.secondary}};
            --tertiary: {{branding.colors.tertiary}};
            --dark: {{branding.colors.dark}};
            --light: {{branding.colors.light}};
            --accent: {{branding.colors.accent}};
        }
    </style>
    {% endif %}
</head>
<body onload="loadNavbar('{{ logo_path }}'); loadFooter();">
    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="bubble" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
            <div>
                <h2>Welcome to {{current_user.school.slug|upper}} Baseball Analytics</h2>
                <p>Upload a TrackMan file to add it to your archive. Build reports from
                   <a href="/pitching">Pitching</a> or <a href="/batting">Batting</a>.</p>
            </div>
            <div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap;">
                <!-- Order matters: forms.css targets .switch-input:checked + .switch-slider,
                     so the slider has to be the input's immediate next sibling. -->
                <label class="switch-field">
                    <span class="switch-text">Game</span>
                    <input type="checkbox" id="practiceToggle" class="switch-input">
                    <span class="switch-slider"></span>
                    <span class="switch-text">Practice</span>
                </label>
                <input type="file" id="fileUpload" accept=".csv,.xlsx,.xls" onchange="handleFileSelect(event)" style="display: none;">
                <button onclick="uploadFile()" class="upload-btn">Upload File</button>
            </div>
        </div>

        <!-- Staged upload summary + Save action -->
        <div id="uploadSummary"></div>

        <div class="bubble">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
                <h2>Saved Games</h2>
                <span id="savedCount" class="filter-note"></span>
            </div>
            <div class="table-section" style="margin-top: 16px;">
                <div id="savedGames" class="table-scroll">
                    <p class="filter-note">Loading…</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="{{ url_for('static', filename='js/core.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/upload.js') }}"></script>
</body>
</html>
