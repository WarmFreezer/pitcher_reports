<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stat_Line - Custom Stats Guide</title>
    <meta name="description" content="How Stat_Line calculates the school-specific custom stats on the pitcher report.">
    <link rel="icon" href="{{ url_for('static', filename='resources/favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/stats-guide.css') }}">
</head>
<body onload="loadNavbar(); loadFooter();">
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        {% if not guide_html %}
        <div class="bubble">
            <h2 style="margin-bottom: 10px;">Custom Stats Guide</h2>
            <p class="stats-guide-intro">
                Your school doesn't have a custom stats guide on file, so there's nothing to document here.
                See the <a href="/stats-guide">Stats Guide</a> for how the default report stats are calculated.
            </p>
        </div>
        {% else %}
        {{ guide_html | safe }}
        {% endif %}
    </main>

    <div id="footer-placeholder"></div>

    <script src="{{ url_for('static', filename='js/core.js') }}"></script>
</body>
</html>
